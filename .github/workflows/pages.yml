# Publishes web/ to GitHub Pages after the tests pass on main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-sheetjs.sh
      - name: Prepare the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r web/. _site/
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md _site/
          # A new cache name per deploy, so visitors pick up the new version.
          sed -i "s/aquaterra-shell-v1/aquaterra-shell-${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
